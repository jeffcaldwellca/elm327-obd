name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Site code data is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python tools/build_site_data.py
          git diff --exit-code docs/dtc.json || { echo "::error::Run tools/build_site_data.py and commit docs/dtc.json"; exit 1; }
