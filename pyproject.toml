[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "elm327obd"
version = "0.1.1"
description = "OBD2 car diagnostics in your terminal for ELM327 WiFi adapters: live data, trouble codes, readiness, Mode 22"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "src/elm327obd/data/LICENSE.python-OBD"]
authors = [{ name = "Jeff Caldwell" }]
requires-python = ">=3.11"
keywords = [
    "obd", "obd2", "obd-ii", "elm327", "car", "automotive", "diagnostics",
    "dtc", "check-engine", "can-bus", "uds", "mode22", "tui", "textual",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = ["textual>=8.2"]

[project.urls]
Homepage = "https://www.jeffcaldwell.ca/elm327-obd/"
Source = "https://github.com/jeffcaldwellca/elm327-obd"
Issues = "https://github.com/jeffcaldwellca/elm327-obd/issues"
Changelog = "https://github.com/jeffcaldwellca/elm327-obd/releases"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
obd = "elm327obd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elm327obd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = ["docs/"]
