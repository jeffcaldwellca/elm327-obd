[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elm327obd"
version = "0.1.0"
description = "Terminal OBD-II diagnostics for ELM327 WiFi adapters (macOS-friendly TUI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
obd = "elm327obd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/elm327obd"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
