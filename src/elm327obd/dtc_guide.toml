# Plain-English guidance for common OBD-II trouble codes.
#
# This is general automotive guidance, not a diagnosis for a specific vehicle.
# Override or extend any entry in ~/.config/elm327obd/dtc_guide.toml (same format;
# later entries win).
#
# severity:
#   stop     Stop driving as soon as it's safe: risk of engine damage or unsafe operation.
#   soon     Get it fixed soon: affects how the car runs, or can cause damage if ignored.
#   monitor  Fix when convenient: keep an eye on it; usually not urgent.
#   low      Low urgency: mainly emissions/inspection; the car normally drives fine.
#
# codes:  list of codes; "P0301-P0308" expands to every code in the range.
# causes: most likely first.   watch: Mode 01 PIDs that help confirm it.

# ---------------------------------------------------------------- cam timing

[[entry]]
codes = ["P0010", "P0013", "P0020"]
severity = "soon"
summary = "The engine computer can't electrically control a variable cam timing (VVT) oil control solenoid."
causes = [
  "Failed VVT / oil control solenoid",
  "Damaged wiring or corroded connector at the solenoid",
  "Low or very dirty engine oil",
]
checks = [
  "Inspect the solenoid connector and wiring for damage or oil in the connector",
  "Measure solenoid resistance against the service spec",
  "Check the oil level and condition",
]

[[entry]]
codes = ["P0011", "P0012", "P0014", "P0021"]
severity = "soon"
summary = "Actual cam timing doesn't match what the computer commanded."
causes = [
  "Low oil level, wrong oil viscosity, or an overdue oil change",
  "Sticking oil control solenoid or clogged solenoid screen",
  "Stretched timing chain or worn cam phaser (higher mileage engines)",
]
checks = [
  "Check oil level; change oil with the grade specified on the oil cap/manual",
  "Clear the code and see whether it returns after the oil change",
  "If it returns with a rattle at start-up, have the timing chain inspected",
]

[[entry]]
codes = ["P0016", "P0017", "P0018"]
severity = "soon"
summary = "Crankshaft and camshaft positions don't line up the way they should."
causes = [
  "Stretched or jumped timing chain/belt",
  "Faulty cam or crank position sensor",
  "Stuck VVT solenoid or phaser",
  "Damaged sensor reluctor/tone ring",
]
checks = [
  "Note any other cam/crank/VVT codes stored with it",
  "Listen for timing chain rattle on cold start",
  "If the engine runs rough or rattles loudly, stop driving: a jumped chain can wreck the engine",
]

# ---------------------------------------------------------------- O2 sensor heaters

[[entry]]
codes = ["P0030", "P0036", "P0135", "P0141", "P0155", "P0161"]
severity = "low"
summary = "The heater inside an oxygen sensor isn't working, so the sensor is slow to start reading after a cold start."
causes = [
  "Failed O2 sensor heater element (replace the sensor)",
  "Blown fuse for the O2 heater circuit",
  "Damaged wiring near the exhaust",
]
checks = [
  "Check the O2 heater fuse",
  "Measure heater resistance at the sensor connector (typically a few ohms)",
  "Inspect the harness for melted or chafed wires near the exhaust",
]

