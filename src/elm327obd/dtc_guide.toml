  "A real lean (low voltage) or rich (high voltage) condition rather than a bad sensor",
]
checks = [
  "Look for exhaust leaks at the manifold",
  "Check fuel trims: large trims point to a real fuelling problem, not the sensor",
  "A healthy narrow-band upstream sensor switches rapidly between about 0.1 and 0.9 V at warm idle",
  "Fix before long trips: running rich hurts economy and the catalytic converter",
]
watch = ["0114", "0118", "0106", "0107"]

[[entry]]
codes = ["P0136", "P0137", "P0138", "P0139", "P0140", "P0156", "P0157", "P0158"]
severity = "low"
summary = "A downstream oxygen sensor (after the catalytic converter) is faulty. It mainly monitors the converter and has little effect on how the engine runs."
causes = ["Failed O2 sensor", "Damaged wiring or connector", "Exhaust leak near the sensor"]
checks = ["A downstream sensor should read fairly steady (often 0.5–0.8 V) once the converter is warm"]
watch = ["0115", "0119"]

[[entry]]
